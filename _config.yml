theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /oxibonsai
url: "https://miyako.github.io"

title: "oxibonsai"
description: "Local inference, rooted in your app. OxiBonsai for 4D on macOS and Windows."
logo: "/assets/icon.png" # Copied from oxibonsai/Resources/icon.png.
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/oxibonsai"
  is_project_page: false

exclude:
  - ".build"
  - "scripts"
  - "upstream.json"
  - "Cargo.lock"
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "Gemfile"
  - "oxibonsai/*"
  - "lib/*"
  - "include/*"
  - "bin/*"
  - "a/*"
  - "package.json"
