name: Compile and verify component
description: Require a structured Compile project result before packaging.
outputs:
  product_path:
    description: Verified component directory
    value: ${{ github.workspace }}/Components/oxibonsai.4dbase
runs:
  using: composite
  steps:
    - name: Get tool version
      id: tool
      uses: miyako/4D/.github/actions/tool4d-get-version@v1
    - name: Download tool4d
      uses: miyako/4D/.github/actions/tool4d-download@v1
      with:
        platform: ${{ steps.tool.outputs.platform }}
        branch: ${{ steps.tool.outputs.branch }}
        version: ${{ steps.tool.outputs.version }}
        build: ${{ steps.tool.outputs.build }}
        arch: ${{ steps.tool.outputs.arch }}
    - uses: actions/checkout@v4
      with:
        repository: miyako/4d-class-compiler
        ref: b73a89a9eac2636f59bcbd020ccf0aad954cab64
        path: .build/compiler
        persist-credentials: false
    - name: Compile with a machine-readable success gate
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/component-contract.py install
        cp scripts/compile-check.4dm .build/compiler/Project/Sources/Methods/ci_compile.4dm
        report="$RUNNER_TEMP/oxibonsai-compile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
        test ! -e "$report"
        tool4d.app/Contents/MacOS/tool4d .build/compiler/Project/compiler.4DProject \
          --skip-onstartup --startup-method=ci_compile \
          --user-param="$GITHUB_WORKSPACE/.build/component-source/oxibonsai/Project/oxibonsai.4DProject,$report" --dataless
        python3 scripts/component-contract.py report "$report"
        tool4d.app/Contents/MacOS/tool4d .build/compiler/Project/compiler.4DProject \
          --skip-onstartup --startup-method=component_zip \
          --user-param="$GITHUB_WORKSPACE/.build/component-source/oxibonsai/Project/oxibonsai.4DProject,$GITHUB_WORKSPACE" --dataless
        python3 scripts/component-contract.py product Components/oxibonsai.4dbase
        python3 scripts/package-server.py --verify-only --output Components/oxibonsai.4dbase/Resources/bin
